   <g id="text_1">
    <text style="font-size: 8px; font-family: 'Arial', 'DejaVu Sans', sans-serif" transform="translate(51.039225 54.72294)">Complex baseband</text>
    <text style="font-size: 8px; font-family: 'Arial', 'DejaVu Sans', sans-serif" transform="translate(67.280475 63.30144)">record y(t)</text>
   </g>
   <g id="text_2">
    <text style="font-size: 8px; font-family: 'Arial', 'DejaVu Sans', sans-serif" transform="translate(205.1761 54.72294)">Trajectory frontend</text>
    <text style="font-size: 8px; font-family: 'Arial', 'DejaVu Sans', sans-serif" transform="translate(177.0086 63.39519)">VIT / MFT / phase-continuous TBD</text>
   </g>
   <g id="text_3">
    <text style="font-size: 8px; font-family: 'Arial', 'DejaVu Sans', sans-serif" transform="translate(363.147525 54.73269)">Anchor trajectory and start</text>
    <text style="font-size: 8px; font-family: 'Arial', 'DejaVu Sans', sans-serif" transform="translate(359.37565 63.28794)">VIT–SMR, or zero correction</text>
   </g>
   <g id="text_4">
    <text style="font-size: 8px; font-family: 'Arial', 'DejaVu Sans', sans-serif" transform="translate(57.731985 123.11508)">Frequency correction</text>
    <text style="font-size: 8px; font-family: 'Arial', 'DejaVu Sans', sans-serif" transform="translate(64.17261 131.69883)">10 s knot spacing</text>
    <text style="font-size: 8px; font-family: 'Arial', 'DejaVu Sans', sans-serif" transform="translate(57.531985 140.28258)">Initial range ±0.02 Hz</text>
   </g>
   <g id="text_5">
    <text style="font-size: 8px; font-family: 'Arial', 'DejaVu Sans', sans-serif" transform="translate(226.17856 123.12033)">Integrate correction</text>
    <text style="font-size: 8px; font-family: 'Arial', 'DejaVu Sans', sans-serif" transform="translate(213.19731 131.79258)">Affine phase in coefficients</text>
    <text style="font-size: 8px; font-family: 'Arial', 'DejaVu Sans', sans-serif" transform="translate(228.39481 140.37108)">Continuous phase</text>
   </g>
   <g id="text_6">
    <text style="font-size: 8px; font-family: 'Arial', 'DejaVu Sans', sans-serif" transform="translate(375.274725 123.190455)">Block coherence − penalty</text>
    <text style="font-size: 8px; font-family: 'Arial', 'DejaVu Sans', sans-serif" transform="translate(392.730975 131.745705)">Analytic gradient</text>
    <text style="font-size: 8px; font-family: 'Arial', 'DejaVu Sans', sans-serif" transform="translate(386.019725 140.300955)">SQP: 20, 60, T−10 s</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 10px; font-family: 'Arial', 'DejaVu Sans', sans-serif; text-anchor: middle; fill: #c5653f" x="260.63856" y="96.727572" transform="rotate(-0 260.63856 96.727572)">Coherence-driven trajectory refinement</text>
   </g>
   <g id="text_8">
    <text style="font-size: 8px; font-family: 'Arial', 'DejaVu Sans', sans-serif" transform="translate(385.395975 194.991015)">Near-boundary dwell</text>
    <text style="font-size: 8px; font-family: 'Arial', 'DejaVu Sans', sans-serif" transform="translate(381.860975 203.546265)">≥95% of current bound</text>
    <text style="font-size: 8px; font-family: 'Arial', 'DejaVu Sans', sans-serif" transform="translate(388.08535 212.124765)">Longest run ≥30 s?</text>
   </g>
   <g id="text_9">
    <text style="font-size: 8px; font-family: 'Arial', 'DejaVu Sans', sans-serif" transform="translate(210.19231 195.00289)">Local expansion to ±0.04 Hz</text>
    <text style="font-size: 8px; font-family: 'Arial', 'DejaVu Sans', sans-serif" transform="translate(203.38481 203.46439)">Intersecting support + neighbors</text>
    <text style="font-size: 8px; font-family: 'Arial', 'DejaVu Sans', sans-serif" transform="translate(202.10731 212.13664)">Warm start; full three-stage rerun</text>
   </g>
   <g id="text_10">
    <text style="font-size: 8px; font-family: 'Arial', 'DejaVu Sans', sans-serif; text-anchor: middle" x="343.429632" y="193.824936" transform="rotate(-0 343.429632 193.824936)">Yes</text>
   </g>
   <g id="text_11">
